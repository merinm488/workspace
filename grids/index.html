<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

    <!-- SEO Meta Tags -->
    <title>Sign In - Grids Spreadsheet App</title>
    <meta name="description" content="Sign in to Grids - your modern spreadsheet application. Access your spreadsheets from anywhere with secure login.">
    <meta name="keywords" content="spreadsheet login, secure access, grid authentication, excel alternative login">
    <meta name="author" content="Grids">
    <meta name="robots" content="noindex, nofollow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://grids-five.vercel.app/">
    <meta property="og:title" content="Sign In - Grids Spreadsheet App">
    <meta property="og:description" content="Sign in to Grids - your modern spreadsheet application. Access your spreadsheets securely.">
    <meta property="og:image" content="https://grids-five.vercel.app/icons/app-preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="628">
    <meta property="og:image:alt" content="Grids Login Screen">
    <meta property="og:site_name" content="Grids">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://grids-five.vercel.app/">
    <meta name="twitter:title" content="Sign In - Grids Spreadsheet App">
    <meta name="twitter:description" content="Sign in to Grids - your modern spreadsheet application. Access your spreadsheets securely.">
    <meta name="twitter:image" content="https://grids-five.vercel.app/icons/app-preview.png">

    <!-- Additional SEO -->
    <meta name="theme-color" content="#4F46E5">

    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/grids/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/grids/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/grids/icons/apple-touch-icon.png">
    <link rel="manifest" href="/grids/manifest.json">

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Grids">

    <!-- Structured Data for Auth Page -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Grids",
      "description": "Secure authentication for Grids spreadsheet application"
    }
    </script>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <!-- Theme Toggle Button -->
    <div class="theme-toggle-container">
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme">
            <span class="theme-icon sun-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke: currentColor; fill: none;">
                    <circle cx="12" cy="12" r="5" style="stroke: currentColor; fill: none;"></circle>
                    <line x1="12" y1="1" x2="12" y2="3" style="stroke: currentColor;"></line>
                    <line x1="12" y1="21" x2="12" y2="23" style="stroke: currentColor;"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" style="stroke: currentColor;"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" style="stroke: currentColor;"></line>
                    <line x1="1" y1="12" x2="3" y2="12" style="stroke: currentColor;"></line>
                    <line x1="21" y1="12" x2="23" y2="12" style="stroke: currentColor;"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" style="stroke: currentColor;"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" style="stroke: currentColor;"></line>
                </svg>
            </span>
            <span class="theme-icon moon-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke: currentColor; fill: none;">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" style="stroke: currentColor; fill: none;"></path>
                </svg>
            </span>
        </button>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>Grids</h1>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="accessKey">Access Key</label>
                    <input
                        type="text"
                        id="accessKey"
                        name="accessKey"
                        placeholder="Enter your key"
                        required
                        autocomplete="off"
                        autocapitalize="off"
                        autocorrect="off"
                        spellcheck="false"
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" id="loginBtn" class="login-btn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loading" style="display: none;">Signing in...</span>
                    </button>
                </div>

                <div id="loginError" class="login-error" style="display: none;"></div>
                <div id="loginSuccess" class="login-success" style="display: none;"></div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config/config.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login-handler.js"></script>

    <!-- PWA Script -->
    <script src="js/pwa.js"></script>

    <script>
        // Initialize theme on login page
        document.addEventListener('DOMContentLoaded', () => {
            themeManager.init();
        });
    </script>
</body>
</html>
